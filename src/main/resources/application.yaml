spring:

  application:
    name: hplus

    profiles:
      default: dev

  datasource:
    url: jdbc:h2:mem:hplus;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true
    properties:
        hibernate:
          format_sql: true

  management:
    endpoints:
      web:
        exposure:
          include: health,info