type Query {
    getAllCustomers: [Customer!]!
    getCustomerById(id: ID!): Customer
    getCustomerByEmail(email: String!): Customer
}

type Customer {
    id: ID!
    firstName: String!
    lastName: String!
    email: String!
    phoneNumber: String!
    address: String!
    city: String!
    state: String!
    zipCode: String!
}